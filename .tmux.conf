# change prefix binding
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# mouse scrolling
set-option -g mouse on

# vi mode
set -g mode-keys vi

# Wayland clipboard integration (requires wl-clipboard)
# copy-command is used by both `y` in copy mode and mouse selection
set -s copy-command "wl-copy"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
unbind p
bind-key p run "wl-paste -n | tmux load-buffer - ; tmux paste-buffer"

# truecolor: tell tmux the outer terminal supports 24-bit colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# vim-tmux-navigator: C-h/j/k/l move between vim splits and tmux panes
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
# C-l is taken by the navigator: clear the screen with prefix + C-l
bind C-l send-keys C-l
